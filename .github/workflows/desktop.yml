# Desktop packages for every release: Linux (.deb, .rpm, portable .tar.gz), Windows (.msi, .exe)
# and macOS (.dmg), each with a bundled ffmpeg so playback works out of the box; for Arch Linux
# a pacman repository in the release and the AUR package (both use the system ffmpeg).
# Runs when a release is published (scripts/release.sh publishes the Android APK first).
name: Desktop packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: packageDeb packageRpm createDistributable
          - os: windows-latest
            tasks: packageMsi packageExe
          - os: macos-latest
            tasks: packageDmg
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: ffmpeg (Linux, static)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          curl -fL --retry 3 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p desktop/resources/linux ff && tar -xf ff.tar.xz -C ff --strip-components=1
          cp ff/bin/ffmpeg desktop/resources/linux/ffmpeg && chmod +x desktop/resources/linux/ffmpeg
      - name: ffmpeg (Windows, static)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fL --retry 3 -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip -d ff
          mkdir -p desktop/resources/windows
          cp ff/*/bin/ffmpeg.exe desktop/resources/windows/ffmpeg.exe
      - name: ffmpeg (macOS, static)
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop/resources/macos ff
          arch=$(uname -m); [ "$arch" = arm64 ] || arch=amd64
          # Static builds; a second source as a fallback. Without either the app asks for `brew install ffmpeg`.
          if curl -fL -o ff.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/ffmpeg.zip" && unzip -q ff.zip -d ff; then :
          elif curl -fL -o ff.zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" && unzip -q -o ff.zip -d ff; then :
          else echo "::warning::no static ffmpeg for macOS"; exit 0; fi
          cp "$(find ff -name ffmpeg -type f | head -1)" desktop/resources/macos/ffmpeg && chmod +x desktop/resources/macos/ffmpeg

      - name: Build
        shell: bash
        run: |
          tasks=""
          for t in ${{ matrix.tasks }}; do tasks="$tasks :desktop:$t"; done
          ./gradlew --no-daemon $tasks

      - name: Attach to the release
        shell: bash
        run: |
          out=desktop/build/compose/binaries/main
          files=$(find $out -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \))
          if [ -d $out/app/Palimpsest ]; then
            tar -C $out/app -czf Palimpsest-linux-x64.tar.gz Palimpsest
            files="$files Palimpsest-linux-x64.tar.gz"
          fi
          gh release upload "$TAG" $files --clobber

  # A pacman repository in every release: palimpsest-bin built from packaging/aur/PKGBUILD plus the repo database.
  # With [palimpsest] Server = https://github.com/xvin84/palimpsest/releases/latest/download in pacman.conf,
  # `yay -Syu` updates it like any package.
  pacman-repo:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build the package and the repo
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          cp -r packaging/aur /home/builder/pkg && chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          sed -i -e "s/^pkgver=.*/pkgver=${TAG#v}/" -e "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # --nodeps: it only repackages the release's files, nothing here needs ffmpeg or X.
          su builder -c "updpkgsums && makepkg --nodeps --noconfirm"
          repo-add palimpsest.db.tar.gz *.pkg.tar.zst
          # GitHub assets can't be symlinks: pacman fetches palimpsest.db, so it's a copy.
          for f in db files; do rm palimpsest.$f && cp palimpsest.$f.tar.gz palimpsest.$f; done
      - name: Attach to the release
        working-directory: /home/builder/pkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" *.pkg.tar.zst palimpsest.db palimpsest.db.tar.gz \
            palimpsest.files palimpsest.files.tar.gz --clobber

  # The Arch package (palimpsest-bin): the Linux tarball above, repackaged by packaging/aur/PKGBUILD.
  # Needs the AUR_SSH_KEY secret (a private key whose public half is on the AUR account); skipped without it.
  # Only now the release becomes «latest» (scripts/release.sh publishes it without): the APK, the
  # computer packages and the pacman repo behind releases/latest/download appear together.
  latest:
    needs: [package, pacman-repo]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark the release as latest
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest

  aur:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.AUR_SSH_KEY != ''
        with:
          ref: ${{ env.TAG }}
      - name: Set the version
        if: env.AUR_SSH_KEY != ''
        run: sed -i -e "s/^pkgver=.*/pkgver=${TAG#v}/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - name: Publish to the AUR
        if: env.AUR_SSH_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: palimpsest-bin
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/palimpsest.desktop
          updpkgsums: true
          commit_username: xvin84
          commit_email: ivansonofden@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Palimpsest ${{ env.TAG }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
